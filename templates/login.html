<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Smart Classroom</title>

<link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */

body{
background: url("{{ url_for('static', filename='images/image.png') }}") no-repeat center center fixed;
background-size: cover;
font-family: 'Segoe UI', sans-serif;
}

/* dark overlay */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55));
z-index:-1;
}

/* ===== CENTER CONTAINER ===== */

.login-container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* ===== LOGIN CARD ===== */

.login-card{

background: rgba(255,255,255,0.95);
backdrop-filter: blur(10px);

padding:45px;
border-radius:18px;

width:100%;
max-width:420px;

box-shadow:0 25px 50px rgba(0,0,0,0.4);

animation: fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

/* ===== ICON ===== */

.login-icon{
font-size:50px;
margin-bottom:10px;
}

/* ===== TITLE ===== */

.login-title{
font-size:32px;
font-weight:700;
color:#1f4e8c;
margin-bottom:10px;
}

/* ===== INPUT ===== */

.form-control{
border-radius:10px;
padding:12px;
}

/* ===== BUTTON ===== */

.login-btn{

background: linear-gradient(135deg,#1f6feb,#174ea6);

color:white;
border:none;

padding:13px;
border-radius:10px;

font-weight:600;

transition:0.3s;
}

.login-btn:hover{

transform:scale(1.05);

box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

/* ===== LINKS ===== */

.link{
text-decoration:none;
color:#1f4e8c;
font-weight:500;
}

.link:hover{
text-decoration:underline;
}

/* ===== FLASH ===== */

.flash-message{
background:#fee2e2;
color:#991b1b;
padding:10px;
border-radius:6px;
text-align:center;
margin-bottom:15px;
font-size:14px;
}

</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="text-center">

<div class="login-icon">🔐</div>

<h3 class="login-title">Admin Login</h3>

</div>


<!-- Flash Messages -->

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}

<div class="flash-message">
{{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}


<form action="{{ url_for('login') }}" method="POST">

<label class="form-label">Username</label>

<input type="text"
name="username"
class="form-control mb-3"
placeholder="Enter username"
required>


<label class="form-label">Password</label>

<input type="password"
name="password"
class="form-control mb-3"
placeholder="Enter password"
required>


<button class="login-btn w-100">
Login
</button>

</form>


<p class="text-center mt-3">

<a href="{{ url_for('register') }}" class="link">
Create Account
</a>

</p>

<p class="text-center">

<a href="{{ url_for('forgot_password') }}" class="link">
Forgot Password?
</a>

</p>

</div>

</div>

</body>

</html>
