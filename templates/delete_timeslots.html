<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Timeslots</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        .table-header-blue th {
            background-color: #007bff !important;
            color: white !important;
            font-weight: 600 !important;
        }

        .page-title {
            color: #007bff;
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="page-title">Delete Timeslots</h2>

        <form method="POST">

            
            

                <table class="table table-bordered table-striped align-middle">
    <thead class="table-header-blue">
        <tr>
            <th>Select</th>
            <th>ID</th>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
        </tr>
    </thead>

    <tbody>
        {% for t in slots %}
        <tr>
            <td>
                <input type="checkbox" name="delete_ids" value="{{ t[0] }}">
            </td>

            <td>{{ t[0] }}</td>  

            <td>{{ t[1] }}</td> 

            <td>{{ t[2] }}</td>   

            <td>{{ t[3] }}</td>  
        </tr>
        {% endfor %}
    </tbody>
</table>


                

            <button class="btn btn-danger w-100 mt-3">
                Delete Selected Timeslots
            </button>

        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('view_timeslots') }}" class="btn btn-secondary">← Back</a>
        </div>

    </div>

</body>

</html>
