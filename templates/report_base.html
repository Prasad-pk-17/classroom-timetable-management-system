<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Timetable Report</title>

<link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">

<style>

body{
font-family: Arial, sans-serif;
background:white;
padding:30px;
}

/* Title */

.report-title{
text-align:center;
font-size:36px;
font-weight:bold;
margin-bottom:30px;
}

/* Table */

table{
width:100%;
border-collapse:collapse;
}

th, td{
border:1px solid #333;
padding:10px;
text-align:center;
}

th{
background:#e6e6e6;
}

/* Print button */

.print-btn{
margin-top:25px;
text-align:center;
}

.print-btn button{
background:#1f4fa3;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
}

@media print{
.print-btn{
display:none;
}
}

</style>
</head>

<body>

{% block content %}{% endblock %}

</body>
</html>
